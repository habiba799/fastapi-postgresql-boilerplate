name: FastAPI Complete CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # STAGE 1: Continuous Integration (Runs on GitHub Cloud)
  test-and-validate:
    runs-on: ubuntu-latest 

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Application Dependencies
        run: |
          poetry install
          poetry run pip install pytest-httpx pytest-asyncio --upgrade

      - name: Run Automated PyTest Suite
        env:
          APP_ENV: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: test_db
          POSTGRES_PORT: 5432
          DEFAULT_DATABASE: postgres
        run: |
          # 1. Clear permission errors for system logs
          sudo mkdir -p /var/logs
          sudo chown -R $USER:$USER /var/logs
          
          # 2. Write dynamic environment variables matching your exact config files
          echo "APP_ENV=test" > .env
          echo "POSTGRES_USER=postgres" > .db.env
          echo "POSTGRES_PASSWORD=password123" >> .db.env
          echo "POSTGRES_DB=test_db" >> .db.env
          echo "POSTGRES_PORT=5432" >> .db.env
          
          # 3. Duplicate configurations to support any custom file loaders (.env.test)
          cp .env .env.test
          cp .db.env .db.env.test
          
          # 4. Fire up validation tests without warning spam
          poetry run pytest -W ignore::DeprecationWarning

  # STAGE 2: Continuous Deployment (Runs on your Self-Hosted Server)
  deploy-to-centos:
    needs: test-and-validate 
    runs-on: self-hosted 

    steps:
      - name: Checkout Code Locally
        uses: actions/checkout@v4

      - name: Clean Old Python Cache Files
        run: |
          sudo rm -rf **/___pycache___ *.pyc 2>/dev/null || true

      - name: Restart Multi-Container Boilerplate Stack
        run: |
          echo "🚀 GitHub Actions triggering production stack update on CentOS!"
          docker compose down
          docker compose up -d --build
          
          echo "🧹 Automatically pruning unused Docker layers to save storage space..."
          docker system prune -f
